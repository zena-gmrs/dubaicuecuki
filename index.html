<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CEK KHODAM & NASIB ABSURD HARI INI 🗿</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Arial', sans-serif;
            color: #fff;
        }

        #ui-container {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            pointer-events: none;
            z-index: 10;
        }

        h1 {
            font-size: 26px;
            color: #ff0055;
            text-shadow: 3px 3px 0px #00ffff;
            margin: 0 0 5px 0;
            text-transform: uppercase;
        }

        p {
            font-size: 14px;
            color: #ffff00;
            background: rgba(0, 0, 0, 0.6);
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            margin: 0;
        }

        /* Pop-up Hasil Meme */
        #result-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: #111;
            border: 4px dashed #ff0055;
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 0 30px #00ffff;
            transition: transform 0.3s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            max-width: 85%;
            width: 320px;
            z-index: 100;
        }

        #result-modal.active {
            transform: translate(-50%, -50%) scale(1);
        }

        .emoji-title {
            font-size: 50px;
            margin-bottom: 10px;
            animation: bounce 0.5s infinite alternate;
        }

        #result-text {
            font-size: 16px;
            font-weight: bold;
            line-height: 1.4;
            color: #00ffcc;
            margin-bottom: 15px;
        }

        #score-tag {
            font-size: 13px;
            color: #ffcc00;
            background: #222;
            padding: 8px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid #444;
        }

        button {
            background: #ff0055;
            color: #fff;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 0px #990033;
            transition: all 0.1s;
        }

        button:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0px #990033;
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-10px); }
        }
    </style>
</head>
<body>

    <div id="ui-container">
        <h1>🤡 CEK KHODAM & AURA 🗿</h1>
        <p>Pilih salah satu tumbal 3D di bawah! 👇</p>
    </div>

    <div id="result-modal">
        <div class="emoji-title" id="emoji-icon">🗿</div>
        <div id="result-text">Menganalisis Dosa...</div>
        <div id="score-tag" id="score-text">Khodam: Pendiam</div>
        <button onclick="resetQuiz()">Ulangi Dosa Ini 🔄</button>
    </div>

    <!-- Library Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // Setup 3D Canvas
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Pencahayaan Warna-Warni Disco
        const light1 = new THREE.PointLight(0xff0055, 2, 50);
        light1.position.set(-5, 5, 5);
        scene.add(light1);

        const light2 = new THREE.PointLight(0x00ffff, 2, 50);
        light2.position.set(5, -5, 5);
        scene.add(light2);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        // Data Humor & Meme Absurd
        const memeResults = [
            {
                emoji: "🗿",
                text: "Hari ini kamu bakal dikacangin di grup WA, tapi tenang... Aura🗿-mu tetep dingin kayak kulkas mati.",
                score: "Khodam: Batu Batako Senyum (Aura +999)"
            },
            {
                emoji: "💀",
                text: "Nasibmu hari ini: Ketemu mantan pas lagi pake celana pendek bolong & sendal swallow beda warna.",
                score: "Aura: Keroyokan Sepatu Roda (Apes: 88%)"
            },
            {
                emoji: "🤡",
                text: "Mikirin dia yang udah bahagia sama orang lain. Selamat, gelar Badut Terbaik tahun ini milikmu!",
                score: "Status: Badut Profesi Sertifikasi Halal"
            },
            {
                emoji: "💸",
                text: "Dompetmu hari ini sangat estetik, sangat bersih, sampai-sampai tidak ada uang selembar pun di dalamnya.",
                score: "Keuangan: Sangat Minimalis & Clean"
            },
            {
                emoji: "👑",
                text: "Hari ini kamu dapet hoki gede! Kamu bakal nemu uang 2 ribu kumal yang ketlisut di saku celana jeans.",
                score: "Keberuntungan: Sultan Dadakan"
            },
            {
                emoji: "🫠",
                text: "Rencana produktif hari ini: Buka laptop -> Bengong 2 jam -> Tidur siang -> Nyesel.",
                score: "Tingkat Kepekaan: Meleleh Kasur"
            }
        ];

        // Buat 3 Objek 3D Absurd
        const objects = [];

        // Objek 1: Torus Knot (Kabel Ruwet)
        const geo1 = new THREE.TorusKnotGeometry(0.7, 0.2, 64, 8);
        const mat1 = new THREE.MeshPhongMaterial({ color: 0xff0055, wireframe: true });
        const obj1 = new THREE.Mesh(geo1, mat1);
        obj1.position.x = -2.2;

        // Objek 2: Donat Warni-Warni
        const geo2 = new THREE.TorusGeometry(0.8, 0.4, 16, 100);
        const mat2 = new THREE.MeshPhongMaterial({ color: 0x00ffcc, shininess: 100 });
        const obj2 = new THREE.Mesh(geo2, mat2);
        obj2.position.x = 0;

        // Objek 3: Dadu / Bola Datar (Icosahedron)
        const geo3 = new THREE.IcosahedronGeometry(1, 0);
        const mat3 = new THREE.MeshPhongMaterial({ color: 0xffcc00, flatShading: true });
        const obj3 = new THREE.Mesh(geo3, mat3);
        obj3.position.x = 2.2;

        scene.add(obj1, obj2, obj3);
        objects.push(obj1, obj2, obj3);

        camera.position.z = 5;

        // Logika Klik Objek 3D
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let isAnswered = false;

        function handleClick(event) {
            if (isAnswered) return;

            const clientX = event.clientX || (event.touches && event.touches[0].clientX);
            const clientY = event.clientY || (event.touches && event.touches[0].clientY);

            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(objects);

            if (intersects.length > 0) {
                const clickedObj = intersects[0].object;
                isAnswered = true;

                // Animasi muter gila-gilaan pas diklik
                let speed = 0.1;
                const spin = setInterval(() => {
                    clickedObj.rotation.x += speed;
                    clickedObj.rotation.y += speed;
                    clickedObj.scale.x += 0.05;
                    clickedObj.scale.y += 0.05;
                    speed += 0.02;

                    if (clickedObj.scale.x > 2.5) {
                        clearInterval(spin);
                        showMemeResult();
                    }
                }, 30);
            }
        }

        window.addEventListener('pointerdown', handleClick);

        function showMemeResult() {
            const randomRes = memeResults[Math.floor(Math.random() * memeResults.length)];
            
            document.getElementById('emoji-icon').innerText = randomRes.emoji;
            document.getElementById('result-text').innerText = randomRes.text;
            document.getElementById('score-tag').innerText = randomRes.score;
            
            document.getElementById('result-modal').classList.add('active');
        }

        function resetQuiz() {
            document.getElementById('result-modal').classList.remove('active');
            
            // Reset ukuran & status
            objects.forEach(obj => {
                obj.scale.set(1, 1, 1);
            });
            
            setTimeout(() => {
                isAnswered = false;
            }, 300);
        }

        // Loop Animasi
        function animate() {
            requestAnimationFrame(animate);

            // Objek goyang-goyang melayang
            objects.forEach((obj, i) => {
                if (!isAnswered) {
                    obj.rotation.x += 0.02;
                    obj.rotation.y += 0.01;
                    obj.position.y = Math.sin(Date.now() * 0.004 + i) * 0.3;
                }
            });

            renderer.render(scene, camera);
        }
        animate();

        // Responsive Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
