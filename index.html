<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Canvas untuk Status WA</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0d1117;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <!-- Load Library Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // 1. Setup Scene, Camera, Renderer
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 2. Buat Objek 3D (Kubus Wireframe)
        const geometry = new THREE.BoxGeometry(2, 2, 2);
        const material = new THREE.MeshBasicMaterial({ 
            color: 0x00ffcc, 
            wireframe: true 
        });
        const cube = new THREE.Mesh(geometry, material);
        scene.add(cube);

        // 3. Tambahkan Kubus Bagian Dalam
        const innerGeometry = new THREE.BoxGeometry(1.2, 1.2, 1.2);
        const innerMaterial = new THREE.MeshBasicMaterial({ color: 0xff007f });
        const innerCube = new THREE.Mesh(innerGeometry, innerMaterial);
        scene.add(innerCube);

        camera.position.z = 5;

        // 4. Animasi Rotasi
        function animate() {
            requestAnimationFrame(animate);

            cube.rotation.x += 0.01;
            cube.rotation.y += 0.01;

            innerCube.rotation.x -= 0.015;
            innerCube.rotation.y -= 0.015;

            renderer.render(scene, camera);
        }

        animate();

        // Adjust saat window di-resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
