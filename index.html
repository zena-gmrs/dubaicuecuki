<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis 3D Tes Hoki Hari Ini!</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            user-select: none;
        }

        #ui-container {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            pointer-events: none;
        }

        h1 {
            margin: 0;
            font-size: 24px;
            text-shadow: 0 0 10px rgba(0,255,200,0.8);
        }

        p {
            font-size: 14px;
            color: #ccc;
        }

        /* Modal Hasil Kuiz */
        #result-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #00ffcc;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.5);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-width: 80%;
        }

        #result-modal.active {
            transform: translate(-50%, -50%) scale(1);
        }

        #result-text {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #ffe600;
        }

        button {
            background: #00ffcc;
            color: #000;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 0 10px #00ffcc;
        }
    </style>
</head>
<body>

    <div id="ui-container">
        <h1>🔮 TES HOKI 3D HARI INI 🔮</h1>
        <p>Pilih salah satu kotak di bawah untuk lihat nasibmu!</p>
    </div>

    <div id="result-modal">
        <div id="result-text">Mendapatkan Hasil...</div>
        <button onclick="resetQuiz()">Coba Lagi</button>
    </div>

    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // Setup Scene
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);
        const pointLight = new THREE.PointLight(0x00ffcc, 1, 100);
        pointLight.position.set(0, 5, 5);
        scene.add(pointLight);

        // Daftar Hasil Lucu-Lucuan
        const hasilQuiz = [
            "🏆 HOKI BESAR! Hari ini kamu bakal ditembak gebetan (atau minimal ditembak debt collector).",
            "💣 ZONK! Hari ini dompetmu makin tipis, tapi dosamu makin tebal.",
            "👑 SULTAN! Hari ini rezekimu lancar kayak air terjun, uang jajan melimpah!",
            "👻 APES! Hari ini kamu bakal ketiduran terus ditinggal rombongan.",
            "💖 JODOH DEKAT! Jodohmu udah berjarak 50 meter, tapi dia lagi gandengan sama yang lain."
        ];

        // Buat 3 Kotak 3D
        const boxes = [];
        const boxGeometry = new THREE.BoxGeometry(1.5, 1.5, 1.5);
        const colors = [0xff0055, 0x00ffcc, 0xffcc00];

        for (let i = 0; i < 3; i++) {
            const material = new THREE.MeshPhongMaterial({ 
                color: colors[i], 
                shininess: 100,
                wireframe: false 
            });
            const box = new THREE.Mesh(boxGeometry, material);
            box.position.x = (i - 1) * 2.5; // Jarak antarkotak
            box.userData = { id: i }; // Simpan ID
            scene.add(box);
            boxes.push(box);
        }

        camera.position.z = 6;

        // Raycaster untuk deteksi Klik/Sentuh pada Objek 3D
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let isAnswered = false;

        function onPointerDown(event) {
            if (isAnswered) return;

            // Hitung posisi klik/sentuhan
            const clientX = event.clientX || (event.touches && event.touches[0].clientX);
            const clientY = event.clientY || (event.touches && event.touches[0].clientY);

            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(boxes);

            if (intersects.length > 0) {
                const clickedBox = intersects[0].object;
                isAnswered = true;

                // Animasi Rotasi Cepat saat diklik
                let count = 0;
                const spinInterval = setInterval(() => {
                    clickedBox.rotation.y += 0.3;
                    clickedBox.rotation.x += 0.3;
                    count++;
                    if(count > 15) {
                        clearInterval(spinInterval);
                        showResult();
                    }
                }, 30);
            }
        }

        window.addEventListener('pointerdown', onPointerDown);

        function showResult() {
            const randomResult = hasilQuiz[Math.floor(Math.random() * hasilQuiz.length)];
            document.getElementById('result-text').innerText = randomResult;
            document.getElementById('result-modal').classList.add('active');
        }

        function resetQuiz() {
            document.getElementById('result-modal').classList.remove('active');
            isAnswered = false;
        }

        // Loop Render/Animasi
        function animate() {
            requestAnimationFrame(animate);

            // Kotak berputar perlahan saat idle
            boxes.forEach((box, index) => {
                if (!isAnswered) {
                    box.rotation.x += 0.01;
                    box.rotation.y += 0.01;
                    box.position.y = Math.sin(Date.now() * 0.003 + index) * 0.2; // Efek melayang
                }
            });

            renderer.render(scene, camera);
        }
        animate();

        // Responsive Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
