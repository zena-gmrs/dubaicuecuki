<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flappy Bird Sederhana</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial, sans-serif;
    }

    #game-container {
      position: relative;
      width: 360px;
      height: 600px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    canvas {
      background-color: #70c5ce;
      display: block;
      border-radius: 8px;
    }

    #instructions {
      position: absolute;
      bottom: -35px;
      width: 100%;
      text-align: center;
      color: #fff;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="canvas" width="360" height="600"></canvas>
    <div id="instructions">Tekan **Spasi** atau **Klik Layar** untuk Melompat</div>
  </div>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    // Variabel Game
    let frames = 0;
    let score = 0;
    let highScore = 0;
    let gameOver = false;

    // Objek Burung
    const bird = {
      x: 50,
      y: 150,
      width: 30,
      height: 30,
      gravity: 0.25,
      jump: 4.6,
      velocity: 0,
      
      draw() {
        ctx.fillStyle = "#f4c430"; // Warna kuning burung
        ctx.beginPath();
        ctx.arc(this.x + this.width / 2, this.y + this.height / 2, this.width / 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#000";
        ctx.lineWidth = 2;
        ctx.stroke();

        // Mata
        ctx.fillStyle = "#fff";
        ctx.beginPath();
        ctx.arc(this.x + 20, this.y + 10, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#000";
        ctx.beginPath();
        ctx.arc(this.x + 22, this.y + 10, 2, 0, Math.PI * 2);
        ctx.fill();

        // Paruh
        ctx.fillStyle = "#e06000";
        ctx.fillRect(this.x + 22, this.y + 16, 10, 6);
      },

      update() {
        this.velocity += this.gravity;
        this.y += this.velocity;

        // Cek tabrakan dengan tanah
        if (this.y + this.height >= canvas.height - 50) {
          this.y = canvas.height - 50 - this.height;
          gameOver = true;
        }

        // Cek jika terbang terlalu tinggi ke atas
        if (this.y <= 0) {
          this.y = 0;
          this.velocity = 0;
        }
      },

      flap() {
        this.velocity = -this.jump;
      },

      reset() {
        this.y = 150;
        this.velocity = 0;
      }
    };

    // Objek Pipa
    const pipes = {
      position: [],
      topMinHeight: 50,
      gap: 120,
      width: 50,
      dx: 2,

      draw() {
        ctx.fillStyle = "#2e8b57"; // Warna hijau pipa
        ctx.strokeStyle = "#000";
        ctx.lineWidth = 2;

        for (let i = 0; i < this.position.length; i++) {
          let p = this.position[i];
          let topYPos = p.y;
          let bottomYPos = p.y + this.gap;

          // Pipa Atas
          ctx.fillRect(p.x, 0, this.width, topYPos);
          ctx.strokeRect(p.x, 0, this.width, topYPos);

          // Pipa Bawah
          ctx.fillRect(p.x, bottomYPos, this.width, canvas.height - bottomYPos - 50);
          ctx.strokeRect(p.x, bottomYPos, this.width, canvas.height - bottomYPos - 50);
        }
      },

      update() {
        // Buat pipa baru setiap 120 frame
        if (frames % 120 === 0) {
          let maxPos = canvas.height - 50 - this.gap - this.topMinHeight;
          let randomY = Math.floor(Math.random() * maxPos) + this.topMinHeight;

          this.position.push({
            x: canvas.width,
            y: randomY,
            passed: false
          });
        }

        for (let i = 0; i < this.position.length; i++) {
          let p = this.position[i];

          // Deteksi Tabrakan
          let hitTop = bird.x + bird.width > p.x && 
                         bird.x < p.x + this.width && 
                         bird.y < p.y;
          let hitBottom = bird.x + bird.width > p.x && 
                            bird.x < p.x + this.width && 
                            bird.y + bird.height > p.y + this.gap;

          if (hitTop || hitBottom) {
            gameOver = true;
          }

          // Geser pipa ke kiri
          p.x -= this.dx;

          // Tambah Skor jika lolos
          if (p.x + this.width < bird.x && !p.passed) {
            score++;
            p.passed = true;
            if (score > highScore) highScore = score;
          }

          // Hapus pipa yang sudah keluar layar
          if (p.x + this.width <= 0) {
            this.position.shift();
            i--;
          }
        }
      },

      reset() {
        this.position = [];
      }
    };

    // Objek Tanah (Ground)
    const ground = {
      draw() {
        ctx.fillStyle = "#ded895";
        ctx.fillRect(0, canvas.height - 50, canvas.width, 50);
        ctx.fillStyle = "#73bf2e";
        ctx.fillRect(0, canvas.height - 50, canvas.width, 10);
      }
    };

    // Tampilan Skor & Game Over
    function drawUI() {
      ctx.fillStyle = "#fff";
      ctx.font = "bold 25px Arial";
      ctx.fillText(`Skor: ${score}`, 20, 40);

      if (gameOver) {
        ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#fff";
        ctx.font = "bold 30px Arial";
        ctx.textAlign = "center";
        ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 30);

        ctx.font = "20px Arial";
        ctx.fillText(`Skor Akhir: ${score}`, canvas.width / 2, canvas.height / 2 + 10);
        ctx.fillText(`Skor Tertinggi: ${highScore}`, canvas.width / 2, canvas.height / 2 + 40);

        ctx.fillStyle = "#f4c430";
        ctx.font = "16px Arial";
        ctx.fillText("Klik atau Tekan Spasi untuk Main Lagi", canvas.width / 2, canvas.height / 2 + 90);
        ctx.textAlign = "left"; // Reset alignment
      }
    }

    // Reset Game
    function restartGame() {
      bird.reset();
      pipes.reset();
      score = 0;
      frames = 0;
      gameOver = false;
    }

    // Game Loop Utamanya
    function loop() {
      // Clear canvas
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (!gameOver) {
        bird.update();
        pipes.update();
      }

      // Draw objek
      pipes.draw();
      ground.draw();
      bird.draw();
      drawUI();

      frames++;
      requestAnimationFrame(loop);
    }

    // Event Listener Kontrol Input
    function handleAction() {
      if (gameOver) {
        restartGame();
      } else {
        bird.flap();
      }
    }

    window.addEventListener("keydown", (e) => {
      if (e.code === "Space") {
        e.preventDefault();
        handleAction();
      }
    });

    canvas.addEventListener("click", () => {
      handleAction();
    });

    // Jalankan Game
    loop();
  </script>
</body>
</html>
